<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>貸し部屋予約</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="css/style.css?v=20260406a">
  <link rel="stylesheet" href="css/style_responsive.css?v=20260406a">
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>貸し部屋予約</h1>
      <p class="subtitle">メールアドレス・団体名・部屋・利用日を入力して、予約をその場で申請できます。</p>
    </header>

    <form action="submit.php" method="post" class="form" id="reservationForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="email">メールアドレス <span class="required">*</span></label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="s(学籍番号)@bene.fit.ac.jp または (団体名)@bene.fit.ac.jp"
            pattern="^[^@]+@bene\.fit\.ac\.jp$"
            title="@bene.fit.ac.jp のメールアドレスのみ使用できます"
            required
          >
        </div>

        <div class="form-group">
          <label for="organization_name">団体名 <span class="required">*</span></label>
          <input
            type="text"
            name="organization_name"
            id="organization_name"
            maxlength="150"
            placeholder="例：総合管理事務局"
            required
          >
        </div>

        <div class="form-group">
          <label for="room_code">部屋 <span class="required">*</span></label>
          <select name="room_code" id="room_code" required>
            <option value="">部屋を選択してください</option>
            <option value="tamoku">多目的室</option>
            <option value="orange">オレンジの部屋</option>
          </select>
        </div>

        <div class="form-group">
          <label for="use_date_display">選択した利用日 <span class="required">*</span></label>
          <input type="text" id="use_date_display" placeholder="カレンダーから選択してください" readonly required>
          <input type="hidden" name="use_date" id="use_date">
        </div>
      </div>

      <section class="calendar-panel" aria-labelledby="calendarHeading">
        <div class="calendar-header">
          <div>
            <h2 id="calendarHeading">利用日の選択</h2>
            <p class="calendar-caption">予約可能期間は本日から2日後〜2か月先までです。</p>
          </div>
          <div class="calendar-nav">
            <button type="button" id="prevMonth" class="calendar-nav-btn">‹ 前月</button>
            <button type="button" id="goToday" class="calendar-nav-btn">選択範囲へ戻る</button>
            <button type="button" id="nextMonth" class="calendar-nav-btn">翌月 ›</button>
          </div>
        </div>

        <div class="calendar-status-row">
          <strong id="calendarTitle">読み込み中...</strong>
          <span id="calendarStatusText">予約状況を取得しています。</span>
        </div>

        <div class="calendar-legend">
          <span><i class="legend-box legend-available"></i>空き</span>
          <span><i class="legend-box legend-booked"></i>選択中の部屋で予約済み</span>
          <span><i class="legend-box legend-disabled"></i>選択不可</span>
          <span><i class="legend-box legend-selected"></i>選択中</span>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>

        <div class="calendar-detail" id="calendarDetail">
          <p class="calendar-detail-placeholder">部屋を選び、利用日をクリックしてください。</p>
        </div>
      </section>

      <div class="form-group terms-consent">
        <label class="checkbox-line">
          <input type="checkbox" id="agreeTerms" name="agree_terms" value="1" required>
          利用規約に同意します <span class="required">*</span>
        </label>
        <a href="terms.html" class="terms-link-btn" target="_blank" rel="noopener">利用規約を表示</a>
      </div>

      <button type="submit" class="submit-btn">予約する</button>
    </form>

    <p class="copyright">&copy; 2026 総合管理事務局. All rights reserved.</p>
  </div>

  <script src="js/calendar.js?v=20260406a" defer></script>
</body>
</html>
