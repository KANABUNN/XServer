<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0d13">
  <title>400 Bad Request | 総合管理事務局 運営ウェブサイト</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('fitsc-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* 保存領域が使えない環境では既定のダーク */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
  <style>
    :root {
      --bg: #0b0d13;
      --bg-glow-1: rgba(124, 92, 255, .22);
      --bg-glow-2: rgba(56, 189, 248, .12);
      --surface: rgba(20, 23, 33, .82);
      --surface-2: rgba(255, 255, 255, .04);
      --border: rgba(255, 255, 255, .09);
      --text: #e7e9f0;
      --text-strong: #ffffff;
      --text-muted: #a3a9ba;
      --accent: #a594ff;
      --accent-fill: #7c5cff;
      --accent-fill-2: #4f8cff;
      --accent-soft: rgba(124, 92, 255, .14);
      --warning: #fbbf24;
      --success: #34d399;
      --shadow: 0 30px 80px -24px rgba(0, 0, 0, .7);
      --font: "Inter", "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f5f6fa;
      --bg-glow-1: rgba(124, 92, 255, .14);
      --bg-glow-2: rgba(56, 189, 248, .10);
      --surface: rgba(255, 255, 255, .9);
      --surface-2: #f6f7fb;
      --border: #e3e6ee;
      --text: #2a3142;
      --text-strong: #111827;
      --text-muted: #5f6779;
      --accent: #5b3ff2;
      --accent-soft: rgba(91, 63, 242, .09);
      --warning: #b45309;
      --success: #047857;
      --shadow: 0 30px 70px -30px rgba(30, 41, 59, .35);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: calc(28px + env(safe-area-inset-top, 0px)) 16px calc(28px + env(safe-area-inset-bottom, 0px));
      display: grid;
      place-items: center;
      font-family: var(--font);
      color: var(--text);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(60rem 40rem at 12% -10%, var(--bg-glow-1), transparent 60%),
        radial-gradient(50rem 36rem at 100% 10%, var(--bg-glow-2), transparent 60%),
        var(--bg);
      transition: background-color .3s ease, color .3s ease;
    }
    body, body *:not(input):not(textarea):not(select):not(.allow-select) { -webkit-user-select: none; user-select: none; }
    a { color: inherit; text-decoration: none; }
    .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

    .theme {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 14px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: color .2s, transform .2s;
    }
    .theme:hover { color: var(--text-strong); transform: rotate(-12deg); }
    .theme .sun { display: none; }
    :root[data-theme="light"] .theme .sun { display: block; }
    :root[data-theme="light"] .theme .moon { display: none; }

    .card {
      width: min(100%, 640px);
      padding: clamp(24px, 5vw, 44px);
      border-radius: 28px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      animation: rise .6s cubic-bezier(.16, 1, .3, 1) both;
    }
    .code-row { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .code {
      margin: 0;
      font-size: clamp(4.4rem, 15vw, 6.6rem);
      font-weight: 800;
      line-height: .9;
      letter-spacing: -.06em;
      background: linear-gradient(120deg, var(--accent-fill), var(--accent-fill-2) 55%, var(--accent-fill));
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sheen 6s ease-in-out infinite;
    }
    .en {
      margin: 0 0 6px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .kicker { margin: 0 0 4px; color: var(--text-muted); font-size: .8rem; font-weight: 700; letter-spacing: .06em; }
    h1 { margin: 0 0 10px; color: var(--text-strong); font-size: clamp(1.5rem, 4.2vw, 2rem); line-height: 1.35; letter-spacing: -.01em; }
    .lead { margin: 0 0 22px; color: var(--text-muted); font-size: 1rem; }
    .details { display: grid; gap: 10px; margin: 0 0 24px; padding: 0; list-style: none; }
    .details li {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      animation: rise .6s cubic-bezier(.16, 1, .3, 1) both;
    }
    .details li:nth-child(2) { animation-delay: .06s; }
    .details .mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; }
    .details .mark--cause { background: rgba(251, 191, 36, .12); color: var(--warning); }
    .details .mark--fix { background: rgba(52, 211, 153, .12); color: var(--success); }
    .details strong { display: block; color: var(--text-strong); font-size: .86rem; }
    .details span { display: block; color: var(--text-muted); font-size: .92rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-strong);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s, background-color .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(.98); }
    .btn--primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent-fill), var(--accent-fill-2));
      color: #fff;
      box-shadow: 0 12px 30px -10px rgba(124, 92, 255, .7);
    }
    .btn:focus-visible, .theme:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .note { margin: 20px 0 0; color: var(--text-muted); font-size: .84rem; }
    .request-id {
      display: inline-block;
      margin: 0 .2em;
      padding: .05em .55em;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      -webkit-user-select: text;
      user-select: text;
    }
    @media (max-width: 560px) {
      body { place-items: start center; padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
      .actions { display: grid; }
      .btn { width: 100%; }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes sheen { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
<script src="../assets/common/context-menu-guard.js?v=20260713" defer></script>
</head>
<body>
  <button class="theme" type="button" id="theme-toggle" aria-label="表示テーマを切り替え"><svg class="ico moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="ico sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <main class="card" aria-labelledby="error-title">
    <div class="code-row">
      <p class="code" aria-label="HTTP ステータス 400">400</p>
      <p class="en">Bad Request</p>
    </div>
    <p class="kicker">総合管理事務局 運営ウェブサイト</p>
    <h1 id="error-title">リクエストを正しく処理できませんでした</h1>
    <p class="lead">送信された内容、URL、またはアクセス方法に不正な形式が含まれている可能性があります。</p>
    <ul class="details" aria-label="エラーの詳細">
      <li><span class="mark mark--cause"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span><div><strong>想定原因</strong><span>入力内容が壊れている、URLに不要な文字が含まれている、またはブラウザから送信された情報をサーバーが解釈できなかった可能性があります。</span></div></li>
      <li><span class="mark mark--fix"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><div><strong>対応方法</strong><span>URLを確認し、必要に応じてページを開き直してください。フォーム送信中の場合は、入力内容を確認してから再度送信してください。</span></div></li>
    </ul>
    <div class="actions">
      <a class="btn btn--primary" href="/"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>トップページへ</a>
      <button class="btn" type="button" id="history-back"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>前のページへ戻る</button>
    </div>
    <p class="note">管理者へ連絡する場合は、表示された番号 <span class="request-id">400</span> と発生時刻を併せて伝えてください。</p>
  </main>
  <script>
    (function () {
      var root = document.documentElement;
      document.getElementById('theme-toggle').addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('fitsc-theme', next); } catch (e) { /* noop */ }
      });
      document.getElementById('history-back').addEventListener('click', function () {
        if (history.length > 1) history.back(); else location.href = '/';
      });
    })();
  </script>
</body>
</html>
