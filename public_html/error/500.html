<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f7fb">
  <title>500 Internal Server Error | 総合管理事務局 運営ウェブサイト</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fbff;
      --text: #16202b;
      --muted: #5b6b7b;
      --line: #d7e0ea;
      --line-strong: #c3d1e0;
      --primary: #1f5fae;
      --primary-strong: #174a87;
      --primary-soft: #eef5fd;
      --danger: #b42318;
      --warn: #a15c00;
      --shadow: 0 20px 44px rgba(20, 38, 64, 0.12);
      --radius: 24px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: calc(32px + var(--safe-top)) calc(20px + var(--safe-right))
               calc(32px + var(--safe-bottom)) calc(20px + var(--safe-left));
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(31, 95, 174, 0.16), transparent 30%),
        radial-gradient(circle at 86% 22%, rgba(23, 74, 135, 0.12), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 52%, #eef4fb 100%);
      line-height: 1.7;
    }

    body,
    body *:not(input):not(textarea):not(select):not(option):not([contenteditable="true"]):not(.allow-select) {
      -webkit-user-select: none;
      user-select: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .error-shell {
      width: min(100%, 920px);
    }

    .error-card {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(180px, 0.42fr) minmax(0, 1fr);
      gap: 28px;
      align-items: stretch;
      padding: clamp(24px, 4vw, 42px);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(215, 224, 234, 0.95);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .error-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(31, 95, 174, 0.10), transparent 34%),
        linear-gradient(315deg, rgba(255, 255, 255, 0.52), transparent 42%);
    }

    .error-status,
    .error-main {
      position: relative;
      z-index: 1;
    }

    .error-status {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 300px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(238, 245, 253, 0.95), rgba(248, 251, 255, 0.95));
    }

    .status-label {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .error-code {
      margin: 0;
      color: var(--primary-strong);
      font-size: clamp(4.2rem, 9vw, 7.4rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.08em;
    }

    .error-en {
      margin: 16px 0 0;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .error-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .site-kicker {
      margin: 0 0 10px;
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.75rem, 3.5vw, 2.55rem);
      line-height: 1.28;
      letter-spacing: -0.04em;
    }

    .lead {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .detail-box {
      display: grid;
      gap: 12px;
      margin: 0 0 24px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel-soft);
    }

    .detail-row {
      display: grid;
      grid-template-columns: 5.5em minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .detail-row strong {
      color: var(--text);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .detail-row span {
      color: var(--muted);
      min-width: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 11px 18px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-weight: 800;
      line-height: 1.2;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .button-primary {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 10px 22px rgba(31, 95, 174, 0.22);
    }

    .button-secondary {
      color: var(--text);
      background: #fff;
      border-color: var(--line-strong);
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button-primary:hover {
      background: var(--primary-strong);
    }

    .note {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .request-id {
      display: inline-block;
      margin-left: 0.25em;
      padding: 0.08em 0.45em;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-strong);
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      user-select: text;
      -webkit-user-select: text;
    }

    @media (max-width: 760px) {
      body {
        padding: calc(18px + var(--safe-top)) calc(14px + var(--safe-right))
                 calc(18px + var(--safe-bottom)) calc(14px + var(--safe-left));
        place-items: start center;
      }

      .error-card {
        grid-template-columns: 1fr;
        gap: 16px;
        border-radius: 20px;
      }

      .error-status {
        min-height: auto;
        padding: 18px;
      }

      .error-code {
        font-size: clamp(3.8rem, 20vw, 5.6rem);
      }

      .detail-row {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="error-shell" aria-labelledby="error-title">
    <section class="error-card">
      <aside class="error-status" aria-label="HTTP status">
        <p class="status-label">HTTP Status</p>
        <p class="error-code">500</p>
        <p class="error-en">Internal Server Error</p>
      </aside>

      <section class="error-main">
        <p class="site-kicker">総合管理事務局 運営ウェブサイト</p>
        <h1 id="error-title">サーバー内部でエラーが発生しました</h1>
        <p class="lead">サーバー側の処理中に問題が発生したため、ページを表示できませんでした。</p>

        <div class="detail-box" aria-label="エラーの詳細">
          <div class="detail-row">
            <strong>想定原因</strong>
            <span>プログラム、設定ファイル、データベース接続、外部API連携などで一時的な問題が起きている可能性があります。</span>
          </div>
          <div class="detail-row">
            <strong>対応方法</strong>
            <span>しばらく時間をおいて再度アクセスしてください。管理者はサーバーログを確認してください。</span>
          </div>
        </div>

        <div class="actions">
          <a class="button button-primary" href="/">トップページへ戻る</a>
          <button class="button button-secondary" type="button" onclick="if (history.length > 1) history.back(); else location.href='/'">前のページへ戻る</button>
        </div>

        <p class="note">管理者へ連絡する場合は、表示された番号 <span class="request-id">500</span> と発生時刻を併せて伝えてください。</p>
      </section>
    </section>
  </main>
</body>
</html>
