date.timezone = Asia/Tokyo

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

log_errors = On
error_log = /proc/self/fd/2

memory_limit = 256M
max_execution_time = 120

upload_max_filesize = 128M
post_max_size = 140M
max_file_uploads = 50

session.cookie_httponly = 1

opcache.enable = 0